<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460" role="img" aria-label="How Promptory works: an intake starts a run; machines, signals and gates carry validated boxes to a pallet; return belts send work back; managers propose and you decide; everything is files in a git repository">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#e0a43a"/>
    </marker>
    <marker id="arrow-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#9c9891"/>
    </marker>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141412"/>
      <stop offset="1" stop-color="#232220"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif; }
    .title { font-size: 16px; font-weight: 650; fill: #ecebe8; }
    .sub { font-size: 12.5px; fill: #9c9891; }
    .lane { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; fill: #9c9891; }
    .intake { fill: #2a2825; stroke: #6b6862; stroke-width: 1.8; }
    .machine { fill: #2a2825; stroke: #6cc08e; stroke-width: 2.2; }
    .signal { fill: #2a2825; stroke: #e0a43a; stroke-width: 2.2; }
    .gate { fill: #2a2825; stroke: #b3261e; stroke-width: 2.2; }
    .pallet { fill: #1d1c1a; stroke: #e0a43a; stroke-width: 2.6; }
    .human { fill: #1d1c1a; stroke: #e0a43a; stroke-width: 2; stroke-dasharray: 6 5; }
    .flow { stroke: #e0a43a; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
    .back { stroke: #c07a2c; stroke-width: 2; fill: none; stroke-dasharray: 7 5; marker-end: url(#arrow); }
    .propose { stroke: #9c9891; stroke-width: 1.8; fill: none; stroke-dasharray: 5 5; marker-end: url(#arrow-dim); }
    .note { font-size: 12px; fill: #e0a43a; font-style: italic; }
  </style>
  <rect width="1200" height="460" rx="14" fill="url(#bg)"/>

  <text x="40" y="168" class="lane">A production line</text>

  <!-- the line -->
  <rect x="40" y="180" width="150" height="86" rx="12" class="intake"/>
  <text x="58" y="212" class="title">Intake</text>
  <text x="58" y="236" class="sub">Starts a run from</text>
  <text x="58" y="254" class="sub">a work order</text>

  <rect x="228" y="180" width="160" height="86" rx="12" class="machine"/>
  <text x="246" y="212" class="title">Machine</text>
  <text x="246" y="236" class="sub">A headless agent with</text>
  <text x="246" y="254" class="sub">a role and a contract</text>

  <rect x="426" y="180" width="150" height="86" rx="12" class="signal"/>
  <text x="444" y="212" class="title">Signal</text>
  <text x="444" y="236" class="sub">A script: exit 0</text>
  <text x="444" y="254" class="sub">passes the box</text>

  <rect x="614" y="180" width="150" height="86" rx="12" class="gate"/>
  <text x="632" y="212" class="title">Gate</text>
  <text x="632" y="236" class="sub">Holds the box until</text>
  <text x="632" y="254" class="sub">you release it</text>

  <rect x="802" y="180" width="160" height="86" rx="12" class="machine"/>
  <text x="820" y="212" class="title">Machine</text>
  <text x="820" y="236" class="sub">The next step, with a</text>
  <text x="820" y="254" class="sub">clean context</text>

  <rect x="1000" y="180" width="160" height="86" rx="12" class="pallet"/>
  <text x="1018" y="212" class="title">Pallet</text>
  <text x="1018" y="236" class="sub">The deliverable: a PR,</text>
  <text x="1018" y="254" class="sub">a report, a release</text>

  <path class="flow" d="M190 223 H226"/>
  <path class="flow" d="M388 223 H424"/>
  <path class="flow" d="M576 223 H612"/>
  <path class="flow" d="M764 223 H800"/>
  <path class="flow" d="M962 223 H998"/>
  

  <!-- return belt -->
  <path class="back" d="M501 266 V318 H308 V268"/>
  <text x="332" y="338" class="note">Return belt: a failing check sends the box back for rework</text>

  <!-- managers and you -->
  <text x="40" y="76" class="lane">Who decides</text>
  <rect x="40" y="90" width="190" height="62" rx="12" class="intake"/>
  <text x="58" y="116" class="title">Sector Manager</text>
  <text x="58" y="136" class="sub">Read-only: answers and proposes</text>

  <rect x="470" y="90" width="150" height="62" rx="12" class="human"/>
  <text x="488" y="116" class="title">You</text>
  <text x="488" y="136" class="sub">Accept, release, retry</text>

  <path class="propose" d="M230 121 H468"/>
  <text x="290" y="112" class="note" style="fill:#9c9891">proposals, never actions</text>
  <path class="propose" d="M620 121 H688 V178"/>

  <!-- the factory repository -->
  <rect x="40" y="372" width="1120" height="56" rx="12" fill="#1d1c1a" stroke="#6b6862" stroke-width="1.6" stroke-dasharray="3 5"/>
  <text x="62" y="396" class="title">The factory is a git repository</text>
  <text x="62" y="416" class="sub">Sectors, line models, roles, contracts, signals and policy are files you review as diffs. The app keeps only runtime state: one run.jsonl per run.</text>
</svg>
